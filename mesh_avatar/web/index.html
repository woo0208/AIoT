<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posture Mesh Avatar</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #e8eaed; font-family: system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 14px; top: 12px; font-size: 13px; line-height: 1.5; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .hud b { font-size: 15px; }
  .tag { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .75; }
  .lbl { position: fixed; top: 12px; font-size: 14px; font-weight: 600; text-shadow: 0 1px 2px #000; }
  #lblFront { left: 25%; transform: translateX(-50%); }
  #lblSide  { left: 75%; transform: translateX(-50%); }
  .status-ok { color: #6fdc8c; } .status-wait { color: #f0c36d; } .status-demo { color: #7db8ff; }
  /* TEMPORARY DEMO indicators panel (demo/viewer-indicators-2026-10) */
  #ind { position: fixed; left: 14px; bottom: 40px; font-size: 14px; line-height: 1.45; pointer-events: none;
         background: rgba(20, 22, 26, .82); border: 1px solid #3a4250; border-radius: 6px; padding: 8px 12px; }
  #ind .ph { font-weight: 700; color: #f0c36d; margin-bottom: 4px; }
  #ind td { padding: 1px 10px 1px 0; vertical-align: top; }
  #ind td.v { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  #ind td.n, #ind .pn { opacity: .65; font-size: 12px; }
  #ind .na { opacity: .5; }
  #ind .pr { margin-top: 6px; }
  #ind .jd { font-size: 24px; font-weight: 800; }
  #ind .jd2 { font-size: 17px; font-weight: 700; margin-top: 2px; }
  #ind .jok { color: #6fdc8c; } #ind .jbad { color: #ff7b72; } #ind .jna { color: #f0c36d; }
  #ind .jw { font-size: 12px; color: #f0c36d; margin: 2px 0 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="lbl" id="lblFront">정면 (카메라 시점)</div>
<div class="lbl" id="lblSide">측면</div>
<div class="hud">
  <b>Posture Mesh Avatar</b><br>
  <span id="status" class="status-wait">연결 대기 중…</span><br>
  <span id="info"></span>
</div>
<div id="ind"></div>
<div class="tag">시각화 전용 — 측정된 관절 방향을 메시에 표시한 것이며 측정값이 아닙니다.</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
